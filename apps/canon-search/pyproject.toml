[project]
name = "canon-search"
version = "0.1.0"
description = "正典検索 — 人気ではなく権威で重み付けする、自分専用のドキュメント検索"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
canon-search = "canon_search.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
